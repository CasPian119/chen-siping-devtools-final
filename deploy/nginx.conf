# Ubuntu/Debian site configuration example. Replace server_name before use.
# Document root must contain index.html, styles.css, script.js, and assets/.
server {
    listen 80;
    server_name SERVER_IP_OR_DOMAIN;
    root /var/www/personal-site;
    index index.html;
    charset utf-8;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
    location ^~ /deploy/ {
        deny all;
    }
    location = /README.md {
        deny all;
    }
}
